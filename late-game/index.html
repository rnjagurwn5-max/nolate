<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<title>지각을 해서는 안 돼!</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;700&family=Share+Tech+Mono&display=swap">
<style>
/* Layout: sticky alarm-clock HUD on top, scene (image → text → choices) on the left, inventory/log rail on the right; stacks on phones. Single dark "dawn after the invasion" look by choice. */
:root{
  --bg:#0b0e16;
  --panel:#141927;
  --panel-2:#1b2234;
  --line:#2a3350;
  --ink:#e9ecf4;
  --muted:#8f98b0;
  --alarm:#ff4a3d;      /* bedside alarm-clock red */
  --amber:#ffb627;      /* disaster-alert / caution tape */
  --hp:#47d97f;
  --st:#56c2ff;
  --bat:#f5e06a;
  --alien:#b77cff;
  --f-display:"Black Han Sans","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-digit:"Share Tech Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.65;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit}
button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto}

/* HUD */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.hud-in{max-width:1120px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:10px 22px}
.clock{display:flex;align-items:baseline;gap:10px}
.clock .now{font-family:var(--f-digit);font-size:34px;line-height:1;color:var(--alarm);text-shadow:0 0 14px color-mix(in srgb,var(--alarm) 55%,transparent);letter-spacing:.04em;font-variant-numeric:tabular-nums}
.clock .left{font-family:var(--f-digit);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.clock .left b{color:var(--ink);font-weight:400;font-size:16px}
.bars{display:flex;flex-wrap:wrap;gap:8px 18px;flex:1;min-width:0}
.bar{display:grid;grid-template-columns:auto 110px auto;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.bar .track{height:8px;background:var(--panel-2);border-radius:2px;overflow:hidden;border:1px solid var(--line)}
.bar .fill{height:100%;transition:width .4s ease}
.bar .num{font-family:var(--f-digit);color:var(--ink);font-size:13px;min-width:54px;font-variant-numeric:tabular-nums}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:11.5px;letter-spacing:.04em;padding:3px 8px;border-radius:3px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.warn{border-color:var(--amber);color:var(--amber)}
.chip.hot{border-color:var(--alarm);color:#fff;background:var(--alarm);animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.6}}

/* Main grid */
.main{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;margin-top:20px}
@media (max-width:900px){.main{grid-template-columns:1fr}}
.scene{min-width:0;display:flex;flex-direction:column;gap:16px}
.frame{position:relative;border-radius:6px;overflow:hidden;border:1px solid var(--line);background:var(--panel);aspect-ratio:16/9;max-width:100%}
.frame img{width:100%;height:100%;object-fit:cover;display:block;animation:fade .5s ease}
@keyframes fade{from{opacity:.3;transform:scale(1.02)}to{opacity:1;transform:none}}
.frame .cap{position:absolute;left:0;right:0;bottom:0;padding:40px 18px 14px;background:linear-gradient(transparent,rgba(5,7,12,.92))}
.cap .eyebrow{font-family:var(--f-digit);font-size:12px;letter-spacing:.14em;color:var(--amber);text-transform:uppercase}
.cap h2{font-family:var(--f-display);font-weight:400;font-size:clamp(22px,4vw,34px);line-height:1.15;margin:2px 0 0;text-wrap:balance;color:#fff;text-shadow:0 2px 10px #000}
.ticker{font-size:12.5px;color:var(--muted);display:flex;gap:8px;align-items:center}
.ticker .dot{width:8px;height:8px;border-radius:50%;background:var(--alarm);flex:none;animation:pulse 1s infinite}

.result{border:1px solid var(--line);border-left:3px solid var(--amber);background:var(--panel);padding:12px 16px;border-radius:4px}
.result .rh{font-size:11.5px;letter-spacing:.12em;color:var(--amber);font-family:var(--f-digit)}
.result p{margin:4px 0 8px}
.deltas{display:flex;flex-wrap:wrap;gap:6px}
.d{font-family:var(--f-digit);font-size:12px;padding:2px 7px;border-radius:3px;background:var(--panel-2);border:1px solid var(--line)}
.d.neg{color:var(--alarm)} .d.pos{color:var(--hp)} .d.item{color:var(--amber)} .d.ally{color:var(--alien)}

.story{display:flex;flex-direction:column;gap:10px;max-width:68ch}
.story p{margin:0}
.ln-say{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:baseline}
.who{font-size:12px;font-weight:700;padding:1px 8px;border-radius:3px;background:var(--panel-2);border:1px solid var(--line);white-space:nowrap}
.who.me{color:var(--st);border-color:color-mix(in srgb,var(--st) 40%,var(--line))}
.who.mom{color:#ff9fb3}
.who.teacher{color:var(--amber)}
.who.alien{color:var(--alien)}
.who.army{color:var(--hp)}
.ln-sfx{font-family:var(--f-display);font-size:26px;color:var(--amber);letter-spacing:.02em;transform:skew(-6deg);margin:2px 0!important}
.ln-sys{font-family:var(--f-digit);font-size:13px;color:var(--muted)}
.alert{border-radius:8px;overflow:hidden;border:1px solid color-mix(in srgb,var(--alarm) 50%,var(--line));max-width:520px}
.alert .ah{background:var(--alarm);color:#fff;font-weight:700;font-size:13px;padding:6px 12px;letter-spacing:.04em}
.alert .ab{background:var(--panel-2);padding:10px 12px;font-size:14px}
.bossbar{border:1px solid color-mix(in srgb,var(--alien) 50%,var(--line));border-radius:4px;padding:10px 12px;background:var(--panel)}
.bossbar .row{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px}
.bossbar .row b{color:var(--alien);font-family:var(--f-display);font-weight:400;font-size:17px}
.bossbar .track{height:10px;background:var(--panel-2);border-radius:2px;overflow:hidden}
.bossbar .fill{height:100%;background:var(--alien);transition:width .4s}

.qa{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:4px}
.qa h3{font-family:var(--f-display);font-weight:400;font-size:20px;margin:0;color:#fff}
.hintbtn{border:1px dashed var(--amber);background:transparent;color:var(--amber);padding:6px 12px;border-radius:4px;cursor:pointer;font-size:13px}
.hintbtn:hover{background:color-mix(in srgb,var(--amber) 12%,transparent)}
.hint{background:color-mix(in srgb,var(--amber) 9%,var(--panel));border:1px solid color-mix(in srgb,var(--amber) 45%,var(--line));border-radius:4px;padding:10px 14px;font-size:14px}
.hint b{color:var(--amber);margin-right:6px}

.choices{display:grid;gap:10px}
.ch{display:grid;grid-template-columns:38px 1fr;gap:12px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px 14px;cursor:pointer;transition:border-color .15s,background .15s,transform .15s}
.ch:hover:not(:disabled){border-color:var(--amber);background:var(--panel-2);transform:translateX(3px)}
.ch .k{font-family:var(--f-digit);font-size:22px;color:var(--amber);line-height:1.2}
.ch .t{font-weight:700;font-size:15.5px;color:#fff}
.ch .ds{color:var(--muted);font-size:13.5px;margin-top:2px}
.ch .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.ch .meta span{font-family:var(--f-digit);font-size:11.5px;padding:1px 6px;border-radius:3px;border:1px solid var(--line);color:var(--muted)}
.ch .meta .tm{color:var(--ink)}
.ch .meta .req{color:var(--alien);border-color:color-mix(in srgb,var(--alien) 45%,var(--line))}
.ch.special .t{color:var(--amber)}
.ch:disabled{cursor:not-allowed;opacity:.42}
.ch:disabled .meta .req{color:var(--alarm);border-color:var(--alarm)}

/* Rail */
.rail{display:flex;flex-direction:column;gap:16px;min-width:0}
.box{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px}
.box h4{margin:0 0 10px;font-size:11.5px;letter-spacing:.14em;color:var(--muted);font-weight:500}
.prof{display:flex;flex-direction:column;gap:4px;font-size:13px}
.prof .nm{font-family:var(--f-display);font-size:20px;color:#fff}
.prof .ab{color:var(--muted)}
.prof .ab b{color:var(--ink);font-weight:500}
.inv{display:flex;flex-direction:column;gap:6px;list-style:none;margin:0;padding:0}
.inv li{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13.5px;padding:6px 8px;border-radius:4px;background:var(--panel-2)}
.inv li small{display:block;color:var(--muted);font-size:11.5px;line-height:1.4}
.use{border:1px solid var(--hp);color:var(--hp);background:transparent;border-radius:3px;padding:2px 8px;font-size:12px;cursor:pointer;flex:none}
.use:hover{background:color-mix(in srgb,var(--hp) 14%,transparent)}
.ally{color:var(--alien)}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px;max-height:260px;overflow:auto;font-size:12.5px}
.log li{display:grid;grid-template-columns:44px 1fr;gap:6px;color:var(--muted)}
.log li span{font-family:var(--f-digit);color:var(--alarm);font-variant-numeric:tabular-nums}
.empty{color:var(--muted);font-size:13px}
.restart{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:4px;padding:7px 10px;cursor:pointer;font-size:12.5px;width:100%}
.restart:hover{border-color:var(--alarm);color:var(--alarm)}

/* Title & ending */
.title{max-width:980px;margin:24px auto 0;display:flex;flex-direction:column;gap:20px}
.title .frame{aspect-ratio:auto}
.title .frame img{height:auto}
.kicker{font-family:var(--f-digit);color:var(--amber);letter-spacing:.16em;font-size:12.5px}
.title h1{font-family:var(--f-display);font-weight:400;font-size:clamp(38px,8vw,72px);line-height:1.02;margin:4px 0 6px;color:#fff;text-wrap:balance}
.title h1 em{font-style:normal;color:var(--alarm)}
.title .lede{font-size:17px;max-width:60ch;margin:0;color:var(--ink)}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.rule{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px 14px;font-size:13.5px;color:var(--muted)}
.rule b{display:block;color:var(--ink);font-size:14px;margin-bottom:2px}
.chapters{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;font-size:13px}
.chapters div{border-top:2px solid var(--line);padding-top:6px;color:var(--muted)}
.chapters div b{display:block;color:var(--ink);font-family:var(--f-display);font-weight:400;font-size:16px}
.chapters div span{font-family:var(--f-digit);color:var(--amber);font-size:11px;letter-spacing:.1em}
.go{align-self:flex-start;font-family:var(--f-display);font-size:22px;background:var(--alarm);color:#fff;border:0;border-radius:6px;padding:14px 28px;cursor:pointer;box-shadow:0 0 0 4px color-mix(in srgb,var(--alarm) 25%,transparent)}
.go:hover{filter:brightness(1.1)}
.ending .stamp{display:inline-block;font-family:var(--f-display);font-size:clamp(26px,5vw,40px);padding:6px 18px;border:4px solid currentColor;border-radius:6px;transform:rotate(-3deg);margin:6px 0}
.ending.win .stamp{color:var(--hp)}
.ending.sad .stamp{color:var(--amber)}
.ending.bad .stamp{color:var(--alarm)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 12px}
.stat small{display:block;color:var(--muted);font-size:11.5px;letter-spacing:.08em}
.stat b{font-family:var(--f-digit);font-size:22px;font-weight:400;font-variant-numeric:tabular-nums}

/* QR terminal (no image scene) */
.terminal{aspect-ratio:16/9;max-width:100%;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,#1d2640,#0b0e16 70%)}
.terminal .scr{display:flex;flex-direction:column;align-items:center;gap:10px}
.terminal canvas{width:min(38vw,170px);height:auto;image-rendering:pixelated;border:8px solid #fff;border-radius:4px;background:#fff}
.terminal .lb{font-family:var(--f-digit);color:var(--hp);letter-spacing:.12em;font-size:13px}

@media (max-width:560px){
  .clock .now{font-size:28px}
  .bar{grid-template-columns:auto 70px auto}
  .ln-say{grid-template-columns:1fr;gap:2px}
  .who{justify-self:start}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* additions for storyboard build */
.scn{font-family:var(--f-digit);font-size:12px;color:var(--muted);letter-spacing:.08em}
.scn b{color:var(--ink);font-weight:400}
.rel{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:13px}
.rel span:nth-child(even){font-size:12px;padding:0 7px;border-radius:3px;border:1px solid var(--line)}
.r-good{color:var(--hp);border-color:color-mix(in srgb,var(--hp) 45%,var(--line))!important}
.r-bad{color:var(--alarm);border-color:color-mix(in srgb,var(--alarm) 45%,var(--line))!important}
.r-mid{color:var(--muted)}
.ln-news{border-left:3px solid var(--st);padding:6px 12px;background:var(--panel);font-size:14px}
.ln-news b{display:block;font-size:11px;letter-spacing:.12em;color:var(--st)}
.tele{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13px;margin-top:8px;color:var(--muted)}
.tele b{color:var(--alarm);font-weight:700}
.phase{font-family:var(--f-digit);font-size:11.5px;color:var(--alien);letter-spacing:.1em}
.ehp{display:grid;gap:6px}
.final{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:18px 20px;border:1px solid var(--line);border-radius:6px;background:var(--panel)}
.final .big{font-family:var(--f-digit);font-size:clamp(22px,4.4vw,34px);letter-spacing:.08em;line-height:1.2}
.final .ok{color:var(--hp)} .final .ng{color:var(--alarm)} .final .ws{color:var(--st)}
.final p{margin:8px 0 0;color:var(--muted)}
.ending.sad .frame img{filter:grayscale(.85) contrast(1.05)}
.btnrow{display:flex;flex-wrap:wrap;gap:10px}
.go.ghost{background:transparent;border:1px solid var(--line);box-shadow:none;color:var(--ink);font-size:18px}
.go.ghost:hover{border-color:var(--amber)}
.ch .meta .ok{color:var(--hp);border-color:color-mix(in srgb,var(--hp) 45%,var(--line))}
.ch .meta .ng{color:var(--alarm);border-color:color-mix(in srgb,var(--alarm) 45%,var(--line))}

/* ===== visual-novel screen (courtroom-drama style menus) ===== */
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
#app{min-height:100%}
body.game #app{height:100%}
:root{--bar-hi:#4a97dc;--bar-lo:#1d5796;--bar-edge:rgba(255,255,255,.7);--gold:#f4c94a;--dlg:rgba(7,12,28,.9);--dlgh:clamp(132px,23vh,180px)}
body.game{padding-left:0;padding-right:0;padding-block:0}
.vn{min-height:100%;background:#03050a}
.stagebox{display:flex;flex-direction:column;gap:10px;padding:10px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
.bg{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:6px;order:2;display:block;transition:filter .3s}
.topbar{order:1;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.ebar{order:3}
.tabs{order:4}
.dlg{order:5}
.menu{order:6}
.burst{display:none}

/* plaque & HUD */
.plaque{display:flex;flex-direction:column;background:linear-gradient(180deg,#16244a,#0b1430);border:2px solid var(--bar-edge);border-radius:4px;padding:6px 26px 7px 12px;clip-path:polygon(0 0,100% 0,calc(100% - 16px) 100%,0 100%);min-width:0}
.plaque .pk{font-family:var(--f-digit);font-size:11px;letter-spacing:.14em;color:var(--gold)}
.plaque b{font-family:var(--f-display);font-weight:400;font-size:20px;color:#fff;line-height:1.15}
.plaque .pl{font-size:11.5px;color:#b9c6e6}
.hudr{display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.cap2{display:flex;align-items:center;gap:8px;background:linear-gradient(180deg,var(--bar-hi),var(--bar-lo));border:2px solid var(--bar-edge);border-radius:999px;padding:2px 10px;box-shadow:0 2px 0 rgba(0,0,0,.4)}
.cap2 .chv{color:var(--gold);font-weight:700}
.cap2 .clk{font-family:var(--f-digit);font-size:24px;color:var(--alarm);background:#05070c;border-radius:4px;padding:0 8px;line-height:1.25;text-shadow:0 0 10px color-mix(in srgb,var(--alarm) 60%,transparent);font-variant-numeric:tabular-nums}
.cap2 .lft{font-size:12.5px;font-weight:700;color:#fff;text-shadow:0 1px 0 #0b2a50;white-space:nowrap}
.mbars{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.mb{display:flex;align-items:center;gap:5px;background:rgba(5,8,16,.75);border:1px solid rgba(255,255,255,.25);border-radius:3px;padding:2px 7px;font-size:11px;color:#c9d2ea}
.mb i{display:block;width:64px;height:6px;background:#1b2234;border-radius:2px;overflow:hidden}
.mb i b{display:block;height:100%}
.mb em{font-style:normal;font-family:var(--f-digit);color:#fff;min-width:34px;text-align:right;font-variant-numeric:tabular-nums}
.tools{display:flex;gap:6px;align-items:center}
.tb{border:2px solid var(--bar-edge);background:linear-gradient(180deg,#2a3a63,#141f3d);color:#fff;border-radius:4px;padding:3px 12px;font-size:12.5px;font-weight:700;cursor:pointer}
.tb:hover{border-color:var(--gold)}
.tb.sm{padding:1px 9px;font-size:11.5px;border-width:1px}
.hot2{font-size:12px;font-weight:700;color:#fff;background:var(--alarm);padding:2px 8px;border-radius:3px;animation:pulse 1.1s infinite}

/* enemy bar */
.ebar{background:rgba(6,9,18,.82);border:2px solid color-mix(in srgb,var(--alien) 70%,#fff);border-radius:6px;padding:7px 12px}
.ebar .en{display:flex;align-items:baseline;gap:8px}
.ebar .en b{font-family:var(--f-display);font-weight:400;font-size:18px;color:#fff}
.ebar .ph{font-family:var(--f-digit);font-size:11px;color:var(--alien);letter-spacing:.1em}
.ebar .hpn{margin-left:auto;font-family:var(--f-digit);color:#fff}
.ebar i{display:block;height:9px;background:#1b2234;border-radius:2px;overflow:hidden;margin:5px 0}
.ebar i b{display:block;height:100%;background:linear-gradient(90deg,var(--alien),#ff5fa2);transition:width .4s}
.ebar .nx{font-size:12.5px;color:#c9d2ea}
.ebar .nx strong{color:var(--alarm)}
.ebar .exp{color:var(--hp);font-weight:700;animation:pulse .8s infinite}

/* bottom tabs */
.tabs{display:flex;justify-content:space-between;gap:8px;pointer-events:none}
.tab{background:linear-gradient(180deg,var(--bar-hi),var(--bar-lo));border:2px solid var(--bar-edge);color:#fff;font-size:12.5px;font-weight:700;padding:2px 16px;text-shadow:0 1px 0 #0b2a50;white-space:nowrap}
.tab.tl{clip-path:polygon(0 0,calc(100% - 12px) 0,100% 100%,0 100%);padding-right:22px;border-radius:3px 0 0 3px}
.tab.tr{clip-path:polygon(12px 0,100% 0,100% 100%,0 100%);padding-left:22px;border-radius:0 3px 3px 0}

/* dialogue box */

<body>
<div id="app"></div>

<script>
(function(){
const DEADLINE=590, START=450, TOTAL=25;
const IMG=n=>`img/${n}.jpg`;
const CH={1:['지옥의 기상','권주임의 집'],2:['지하철 대탈출','지하철역'],3:['서울 대전쟁','강남 일대'],4:['외계인의 역습','코엑스'],5:['최후의 출근','코엑스 4층']};
const ITEMS={
  '스마트폰':{d:'출석 QR의 생명줄. 장면마다 배터리 1% 소모'},
  '지갑':{d:'잔액 32,000원'},
  '교통카드':{d:'지하철 탑승용'},
  'AX 마스터즈 수강증':{d:'신분 증명. 군인에게 보여줄 수 있다'},
  '에너지바':{d:'HP +20, 스태미나 +25',use:{hp:20,st:25}},
  '회복킷':{d:'HP +40',use:{hp:40}},
  '보조배터리':{d:'배터리 +50%',use:{bat:50}},
  '외계 신호 기록':{d:'UFO 주파수 패턴. 대화·방어막·레이저 해제'},
  'UFO 사진':{d:'군인을 설득하는 증거'},
  '강사 통화 기록':{d:'"9시 50분까지 오세요." 증거이자 정신 공격 무기'},
  '괴생명체 정보':{d:'첫 전투 적의 약점: 더듬이 밑 관절'},
  '지도자 약점 정보':{d:'외계인 지도자의 약점: 이마의 보석'},
  '소화기':{d:'공격력 +5. 던지면 레이저를 교란한다'},
  '외계 전자 칩':{d:'외계 보안 시스템 교란 · 제어 장치 접근'},
  '오토바이 열쇠':{d:'군인이 빌려준 오토바이'},
  '군사 우회로 정보':{d:'삼성역까지 군 전용 우회로'}
};
const fmt=t=>String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const has=(s,i)=>s.items.includes(i);
const instinct=s=>DEADLINE-s.t<=40;
const R=(v,s)=>typeof v==='function'?v(s):v;
const clamp=v=>Math.max(0,Math.min(100,v));
const trustScore=s=>s.trust+(has(s,'강사 통화 기록')?1:0)+(has(s,'UFO 사진')?1:0);

/* ================= BATTLES ================= */
const BATTLES={
  b1:{name:'외계 생명체',img:'s10',n:9,max:40,win:'sc10',reward:['외계 전자 칩'],flee:'sc10',weakItem:'괴생명체 정보',weakName:'더듬이 관절',weakDmg:25,
      intro:['외계 생명체가 낫 같은 앞발을 치켜든다. 권주임은 벽에서 비상용 소화기를 뜯어냈다.'],
      next:(b,s)=>({name:'앞발 베기',dmg:s.f.alienHostile?15:10})},
  b2:{name:'외계 경비병',img:'s17',n:17,max:60,win:'sc18',reward:['회복킷'],weakName:'갑옷 이음매',weakDmg:30,
      intro:['경비병이 전기 창을 휘두른다. 권주임은 쓰러진 안내판을 방패 삼아 막아선다.'],
      next:(b)=>b.turn%2?{name:'전기 찌르기',dmg:16}:{name:'창 휘두르기',dmg:12}},
  b3:{name:'외계인 지도자',img:'s21',n:21,boss:true,win:'sc22',reward:[],weakItem:'지도자 약점 정보',weakFlag:'bossWeak',weakName:'이마의 보석',weakDmg:35,
      intro:[['외계인 지도자','네가 무엇을 위해 싸우는지 말해라!'],['권주임','출석!!!'],['외계인 지도자','그것이 지구보다 중요한가?'],['권주임','(...이 말은 필살기로 아껴두자.)']],
      next:(b)=>{
        const p=b.hp/b.max;
        if(p>0.66) return b.turn%2?{name:'에너지탄',dmg:14,ph:1}:{name:'일반 공격',dmg:10,ph:1};
        if(p>0.33) return {name:'광역 충격파',dmg:18,ph:2};
        if(!b.charging) return {name:'레이저 충전',dmg:0,ph:3,charge:true};
        return {name:'강력한 레이저',dmg:30,ph:3,laser:true};
      }}
};
function startBattle(s,id,opt={}){
  const d=BATTLES[id];
  const max=id==='b3'?(s.f.controlClean?120:150):d.max;
  s.battle={id,hp:max-(opt.pre||0),max,turn:0,exposed:false,charging:false,phase:1,block:!!opt.block,lastLog:opt.log||''};
  s.battle.nextMove=d.next(s.battle,s);
  return 'BATTLE';
}
function battleChoices(s){
  const b=s.battle,d=BATTLES[b.id],boost=instinct(s)?1.5:1;
  const tt=d.boss?3:2;
  const atk=Math.round((18+(has(s,'소화기')?5:0))*boost);
  const weakKnown=(d.weakItem&&has(s,d.weakItem))||(d.weakFlag&&s.f[d.weakFlag])||b.exposed;
  const enemyTurn=(st,msg,{def=false,stun=false}={})=>{
    const B=st.battle;
    if(B.hp<=0){ // victory
      const rw=d.reward.filter(i=>!has(st,i)); rw.forEach(i=>st.items.push(i));
      st.battle=null;
      const text=msg+` ${d.name}을(를) 쓰러뜨렸다!`+(rw.length?` 전리품: ${rw.join(', ')}.`:'');
      return {res:text,go:d.win};
    }
    const mv=B.nextMove; let line=msg;
    if(stun){ line+=` ${d.name}이(가) 충격으로 움직이지 못한다.`; if(mv.charge) B.charging=true; }
    else if(B.block){ B.block=false; line+=` 역무원의 경고 덕분에 첫 공격을 미리 피했다.`; }
    else if(mv.charge){ B.charging=true; line+=` 지도자가 이마의 보석에 에너지를 모은다. 다음 턴 강력한 레이저!`; }
    else{
      let dmg=mv.dmg;
      if(def){ dmg = mv.laser?0:Math.round(dmg*0.3); }
      if(mv.laser){ B.charging=false; if(def){ B.exposed=true; line+=` 레이저를 막아냈다! 과열된 보석이 그대로 드러났다. 지금이 약점 공격 기회다.`; } }
      if(dmg>0){ st.hp=clamp(st.hp-dmg); line+=` ${d.name}의 ${mv.name}! HP -${dmg}.`; }
      else if(!mv.laser) line+=` ${mv.name}을(를) 완벽히 막았다.`;
    }
    B.turn++;
    const prev=B.phase; B.nextMove=d.next(B,st); if(B.nextMove.ph) B.phase=B.nextMove.ph;
    if(d.boss && B.phase>prev) line+= B.phase===2?' [2페이즈] 지도자의 갑옷이 붉게 달아오른다!':' [3페이즈] 지도자의 보석이 불안정하게 깜빡인다!';
    B.lastLog=line;
    return {res:line,go:'BATTLE'};
  };
  const list=[
    {t:'일반 공격',d:`${has(s,'소화기')?'소화기로':'주먹으로'} 내려친다. 예상 피해 ${atk}.`,time:tt,act:st=>{st.battle.hp-=atk;st.battle.exposed=false;return enemyTurn(st,`${atk}의 피해!`);}},
    {t:'방어',d:'자세를 낮추고 막는다. 받는 피해 70% 감소, 스태미나 +15.'+(d.boss?' 레이저는 완전히 막는다.':''),time:tt,act:st=>{st.st=clamp(st.st+15);return enemyTurn(st,'방어 자세!',{def:true});}},
    {t:'약점 공격',d:`${weakKnown?d.weakName:'???'}을(를) 노린다. 예상 피해 ${Math.round(d.weakDmg*boost)}.`,time:tt,need:{custom:weakKnown,label:'약점 정보 필요'},act:st=>{const dm=Math.round(d.weakDmg*boost);st.battle.hp-=dm;st.battle.exposed=false;return enemyTurn(st,`${d.weakName}에 정타! ${dm}의 피해!`);}},
    {t:'필살기: 출근 본능',d:'"내가 오늘 수업 빠지면 네가 책임질 거야?!" 적을 기절시킨다.',time:1,special:true,need:{st:30},act:st=>{st.st-=30;const dm=Math.round(40*boost);st.battle.hp-=dm;return enemyTurn(st,`광역 정신적 충격! ${dm}의 피해!`,{stun:true});}}
  ];
  s.items.filter(i=>ITEMS[i]?.use&&(ITEMS[i].use.hp||ITEMS[i].use.st)).forEach(i=>{

}

  hint:'3번은 2분이 더 들지만 다음 검문소에서 군인의 신뢰를 얻는 데 도움이 된다. 군인을 설득하면 오토바이를 빌릴 수 있다.',
  choices:[
    {t:'건물 사이 안전한 통로로 이동한다',d:'느리지만 안전하다.',time:12,go:'sc12',res:'건물 사이를 누비며 검문소 앞까지 왔다.'},
    {t:'큰 도로로 빠르게 돌파한다',d:'시간 단축, 체력 감소.',time:6,hp:-15,go:'sc12',res:'파편이 팔을 스쳤다. 그래도 빨랐다.'},
    {t:'시민에게 가장 가까운 경로를 물어본다',d:'현지인의 지혜.',time:8,trust:1,go:'sc12',res:'"검문소 군인들 의외로 착해요. 사정 얘기하면 들어줘요. 증거가 있으면 더 좋고요." (군인 신뢰 +1)'}]},

sc12:{n:12,ch:3,img:'s12',title:'군사 검문소',
  lines:[['','장갑차와 방어시설로 봉쇄된 도로. 무장 군인이 권주임을 막아선다.'],['군인','민간인 통행 금지입니다! 즉시 대피하세요!'],['권주임','저 코엑스 가야 하는데요.'],['군인','지금 전쟁 중입니다!'],['권주임','저도 알아요. 근데 저 지각하면 안 된다고요.']],
  hint:'다음 장면에서 군인 신뢰가 2 이상이면 설득에 성공해 오토바이를 얻는다. 강사 통화 기록과 UFO 사진은 각각 신뢰 +1로 계산된다.',
  choices:[
    {t:'AX 마스터즈 수강증을 보여준다',d:'신분을 밝힌다.',time:6,trust:1,go:'sc13',res:'군인이 수강증을 한참 들여다본다. "...AX 마스터즈?" (신뢰 +1)'},
    {t:'군인의 안내에 따라 우회한다',d:'순순히 따른다.',time:10,trust:2,go:'sc13',res:'시키는 대로 따랐다. 우회로 끝에서 같은 군인이 다시 말을 건다. (신뢰 +2)'},
    {t:'사정을 자세히 설명한다',d:'취준생의 절박함을 전한다.',time:6,st:-5,trust:1,go:'sc13',res:'군인이 한숨을 쉬며 무전기를 내려놓는다. (신뢰 +1)'}]},

sc13:{n:13,ch:3,img:'s13',title:'출석이냐, 국가 안보냐',
  lines:s=>[['군인','왜 목숨을 걸고 강의실에 가려는 겁니까?'],['권주임','제가 지금까지 취업 준비를 얼마나 했는데요! 이것까지 빠질 순 없어요!'],
    ...(has(s,'강사 통화 기록')?[['','권주임이 통화 녹음을 튼다. "9시 50분까지 오세요."']]:[]),
    ...(has(s,'UFO 사진')?[['','옥상에서 찍은 UFO 사진을 내민다. 군인의 눈빛이 달라진다.']]:[]),
    ['군인','...'],['군인','당신... 진심이군요.'],['#',`군인 신뢰도 ${trustScore(s)} / 2`]],
  hint:'신뢰도가 2 이상이면 1번이 가장 좋다. 부족하다면 설득은 실패하고 12분을 더 쓰게 된다. 강제 돌파는 군인을 적으로 돌린다.',
  choices:[
    {t:'설득한다',d:'성공 시 오토바이 열쇠와 군사 우회로 정보.',time:6,note:s=>trustScore(s)>=2?['ok','성공 예상']:['ng','신뢰 부족'],
      act:s=>{ if(trustScore(s)>=2){ ['오토바이 열쇠','군사 우회로 정보'].forEach(i=>{if(!has(s,i))s.items.push(i)}); s.rel['군인']='우호'; return {res:'"타고 가십시오. 삼성역까지 군 우회로도 알려드리죠." 군인이 오토바이 열쇠를 건넨다.',go:'sc14'};}
        s.t+=12; s.rel['군인']='경계'; return {res:'"마음은 알겠지만 안 됩니다. 돌아가세요." 빙 돌아가느라 12분을 더 썼다.',go:'sc14'}; }},
    {t:'검문소를 강제로 돌파한다',d:'적대 상태, 체력 감소.',time:10,hp:-25,set:{armyHostile:1},rel:{군인:'적대'},go:'sc14',res:'바리케이드를 넘었다. 등 뒤로 "멈춰!" 소리와 경고 사격.'},
    {t:'다른 길을 찾는다',d:'안전하지만 오래 걸린다.',time:18,go:'sc14',res:'검문소를 크게 돌아갔다. 18분이 흘렀다.'}]},

sc14:{n:14,ch:3,img:'s14',title:'제3차 세계대전',
  enter:s=>{ if(s.f.armyHostile){ s.hp=clamp(s.hp-10); s.f.chased=1; } },
  lines:s=>[['','하늘을 전투기와 미사일이 가득 메운다. 각국 군대와 외계 함대가 정면으로 충돌한다.'],['뉴스 속보','국제 군사 충돌이 확대되면서 제3차 세계대전 발발 우려가 현실화되고 있습니다!'],['권주임','아니, 3차 대전이면 수업 좀 쉬어야 하는 거 아니야?'],['#','[AX 마스터즈 알림] 금일 교육 정상 진행'],['권주임','와... 진짜 독하다.'],...(s.f.chased?[['','검문소 군인들의 추격 사격! 파편에 맞았다. (HP -10)']]:[])],
  hint:'우회로 정보가 있다면 3번이 가장 빠르고 안전하다. 정보 없이 3번을 고르면 헤맨다.',
  choices:[
    {t:'폭격이 멈추기를 기다린 뒤 이동한다',d:'숨 돌릴 틈.',time:12,st:10,go:'sc15',res:'지하 주차장에서 12분을 기다렸다. 폭격이 잦아든다.'},
    {t:'위험을 감수하고 즉시 돌파한다',d:'시간 단축, 체력 감소.',time:4,hp:-15,go:'sc15',res:'폭발 사이를 뛰었다. 고막이 멍하다.'},
    {t:'우회로 정보를 확인한다',d:'군 우회로가 있다면 최단 경로.',time:s=>has(s,'군사 우회로 정보')?3:8,bat:-2,note:s=>has(s,'군사 우회로 정보')?['ok','우회로 보유']:['ng','정보 없음'],go:'sc15',res:s=>has(s,'군사 우회로 정보')?'군 우회로를 따라 포화를 피해 빠져나왔다.':'지도 앱만 보다 길을 잃었다. 8분을 헤맸다.'}]},

sc15:{n:15,ch:3,img:'s15',title:'삼성역을 향해 질주',
  lines:[['*','부아아아앙!'],['권주임','좋아! 이제 조금만 가면 코엑스다!'],['','하늘에서 외계인 드론이 내려온다.'],['*','콰앙!'],['권주임','아 제발!!! 나 좀 가자!!!']],
  hint:'도보는 27분이나 걸린다. 오토바이 열쇠나 군인과의 우호 관계가 있다면 반드시 활용하자.',
  choices:[
    {t:'오토바이를 이용한다',d:'드론을 뚫고 질주.',time:15,hp:-5,need:{item:'오토바이 열쇠'},go:'sc16',res:'드론 레이저를 지그재그로 피하며 삼성역 사거리에 도착했다.'},
    {t:'도보로 이동한다',d:'체력과 스태미나 감소.',time:27,hp:-10,st:-20,go:'sc16',res:'27분을 뛰었다. 폐가 타는 것 같다.'},
    {t:'군용 차량의 도움을 요청한다',d:'군인과 우호 관계일 때.',time:13,need:{rel:['군인','우호']},go:'sc16',res:'"타십시오!" 장갑차가 드론을 기관포로 떨어뜨리며 코엑스 앞에 멈춘다.'}]},

sc16:{n:16,ch:4,img:'s16',cp:true,title:'외계인에게 점령된 코엑스',
  lines:[['','거대한 우주선이 코엑스 상공에 떠 있다. 건물 입구는 보라색 방어막으로 봉쇄되어 있다.'],['권주임','드디어 코엑스다!'],['외계인 경비병','인간. 이곳은 제국의 지휘 본부다.'],['권주임','아니, 원래 여기 학원인데?']],
  hint:'정문으로 가면 다음 장면에서 잠입이 불가능하다. 측면 통로를 쓰거나, 외계 신호 기록으로 방어막을 조사하면 잠입에 성공할 수 있다.',
  choices:[
    {t:'정문으로 진입한다',d:'정면 돌파.',time:7,set:{frontDoor:1},go:'sc17',res:'정문을 밀고 들어가자 경비병이 곧장 무기를 겨눈다.'},
    {t:'측면 통로를 탐색한다',d:'경비가 느슨한 곳을 찾는다.',time:9,set:{sideDoor:1},go:'sc17',res:'하역장 쪽 측면 통로를 찾았다. 경비병 한 명뿐이다.'},
    {t:'방어막의 약점을 조사한다',d:'신호 기록이 있으면 추가 정보.',time:8,go:'sc17',act:s=>{ if(has(s,'외계 신호 기록')){s.f.shieldIntel=1;return {res:'신호 기록과 대조하니 방어막과 순찰 주기가 보인다. 경비병은 40초마다 등을 돌린다.',go:'sc17'};} return {res:'방어막은 단단했다. 알아낸 것은 없다.',go:'sc17'}; }}]},

sc17:{n:17,ch:4,img:'s17',title:'외계 경비병과의 전투',
  lines:s=>[...(s.f.frontDoor?[['','정문으로 들어온 탓에 경비병이 이미 무기를 겨누고 있다.']]:[]),['외계인 경비병','신분을 밝혀라!'],['권주임','나 AX 마스터즈 수강생이다!'],['외계인 경비병','그게 무엇이지?'],['권주임','몰라?! 나도 지금 왜 여기까지 왔는지 모르겠다!']],
  hint:'정면 전투는 보통 8분 이상 걸리지만 회복킷을 준다. 외계 전자 칩이 있다면 3번이 가장 빠르다. 잠입은 측면 통로나 방어막 정보가 있어야 성공한다.',
  choices:[
    {t:'정면 공격한다',d:'전투 진행. 승리 보상: 회복킷.',time:1,act:s=>({res:'안내판을 방패 삼아 돌진한다. 전투 개시!',go:startBattle(s,'b2')})},
    {t:'숨어서 경비병을 우회한다',d:'잠입 판정.',time:5,note:s=>(s.f.sideDoor||s.f.shieldIntel)&&!s.f.frontDoor?['ok','잠입 성공 예상']:['ng','발각 위험'],
      act:s=>{ if((s.f.sideDoor||s.f.shieldIntel)&&!s.f.frontDoor) return {res:'경비병이 등을 돌린 40초. 그림자처럼 지나갔다.',go:'sc18'};
        s.hp=clamp(s.hp-10); return {res:'발각! 경비병의 선제공격에 HP -10. 전투 개시!',go:startBattle(s,'b2')}; }},
    {t:'외계 전자 칩으로 경비 시스템을 교란한다',d:'칩을 단말기에 꽂는다.',time:5,need:{item:'외계 전자 칩'},go:'sc18',res:'"시스템 오류." 경비병이 경련하듯 굳어버린다. 유유히 지나갔다.'}]},

sc18:{n:18,ch:4,img:'s18',title:'레이저 함정',
  lines:[['','코엑스 복도 전체에 붉은 레이저가 거미줄처럼 설치되어 있다.'],['권주임','아니... 이걸 어떻게 지나가라는 거야?'],['방어 시스템','침입자 감지. 제거 절차를 시작합니다.'],['권주임','아 진짜 출석 한 번 하기 더럽게 힘드네.']],
  hint:'신호 기록이 있으면 4분이면 끝난다. 소화기를 던져 분말로 레이저를 교란할 수도 있다. 관찰해서 지나가려면 스태미나 30 이상이 있어야 덜 다친다.',
  choices:[
    {t:'레이저 패턴을 관찰해 이동한다',d:'스태미나 30 이상이면 피해 적음.',time:8,note:s=>s.st>=30?['ok','HP -5 예상']:['ng','HP -20 예상'],
      act:s=>{ const d=s.st>=30?5:20; s.hp=clamp(s.hp-d); s.st=clamp(s.st-10); return {res:d===5?'패턴을 읽고 몸을 비틀어 통과했다. 팔꿈치만 살짝 그었다.':'다리가 풀려 레이저에 여러 번 스쳤다.',go:'sc19'}; }},
    {t:'외계 신호 기록으로 시스템을 해제한다',d:'같은 주파수로 해제 신호.',time:4,need:{item:'외계 신호 기록'},go:'sc19',res:'"신호 확인. 방어 해제." 레이저가 일제히 꺼진다.'},
    {t:'장비를 던져 레이저를 교란한다',d:'소화기를 던진다.',time:5,need:{item:'소화기'},rm:['소화기'],go:'sc19',res:'소화기가 터지며 분말 구름이 레이저를 산란시킨다. 그 틈에 통과했다.'}]},

sc19:{n:19,ch:4,img:'s19',title:'외계인의 중앙 제어실',
  lines:[['','대형 홀로그램과 외계 문자로 가득 찬 지휘 장치.'],['','홀로그램 기록을 훑던 권주임은 깨닫는다. 이번 공격은 단순한 침공이 아니라, 전 세계 통신과 시간 시스템을 교란해 인류의 방어 체계를 무너뜨리는 작전이었다.'],['','지구를 구하려면 이 지휘 장치를 정지시켜야 한다.'],['권주임','잠깐... 이걸 끄면 전쟁도 끝나는 거야?'],['권주임','그러면 지하철도 다시 다니는 거 아니야?!'],['권주임','진작 알았으면 이거부터 껐지!']],
  hint:'제대로 해제하면(퍼즐 정답 또는 칩) 지도자의 방어막이 약해져 보스 체력이 120이 된다. 강제로 파괴하면 다치고 보스 체력은 150이다.',
  choices:[
    {t:'홀로그램의 규칙을 분석해 해제한다',d:'퍼즐에 도전한다.',time:4,go:'sc19p',res:'홀로그램을 손가락으로 넘기자 도형이 나열된다.'},
    {t:'외계 전자 칩으로 장치에 접근한다',d:'관리자 권한 탈취.',time:4,need:{item:'외계 전자 칩'},set:{controlClean:1},go:'sc20',res:'"관리자 인증." 지휘 장치가 멈추고 지도자의 위치가 표시된다. 보스 방어막 약화!'},
    {t:'강제로 장치를 파괴한다',d:'시스템 불안정으로 위험 증가.',time:6,hp:-20,set:{controlForced:1},go:'sc20',res:'콘솔을 걷어찼다. 폭발과 함께 장치가 꺼졌지만 파편에 맞았다.'}]},

sc19p:{n:19,ch:4,img:'s19',title:'홀로그램 해제 코드',
  lines:[['#','[홀로그램] 해제 순서를 완성하라'],['#','▲ 삼각형  →  ■ 사각형  →  ⬟ 오각형  →  ⬢ 육각형  →  ?'],['권주임','규칙만 찾으면 된다...']],
  hint:'각 도형의 꼭짓점 개수를 세어 보자.',
  choices:[

/* ================= STATE ================= */
const fresh=()=>({scene:'title',t:START,hp:100,st:80,bat:38,items:['스마트폰','지갑','교통카드','AX 마스터즈 수강증'],f:{},trust:0,
  rel:{'엄마':'보통','강사':'보통','군인':'경계','외계인 승객':'모름'},hints:{},log:[],res:null,moves:0,battle:null,cp:null,retries:0,ending:null,showHint:false,defeatAt:null,li:0,focus:0,showInfo:false,showHelp:false});
let S=fresh();
const copy=o=>JSON.parse(JSON.stringify(o));

function curScene(s){ if(s.scene==='BATTLE'){const d=BATTLES[s.battle.id];return {n:d.n,ch:d.n>=20?4:d.n>=16?4:2,img:d.img,title:`${d.name}과의 전투`,battle:true};} return SC[s.scene]; }
function needOK(s,c){
  const n=c.need; if(!n) return [true,''];
  if(n.st!=null&&s.st<n.st) return [false,`스태미나 ${n.st} 필요`];
  if(n.item&&!has(s,n.item)) return [false,`필요: ${n.item}`];
  if(n.any&&!n.any.some(i=>has(s,i))) return [false,`필요: ${n.any.join(' 또는 ')}`];
  if(n.rel&&s.rel[n.rel[0]]!==n.rel[1]) return [false,`${n.rel[0]} ${n.rel[1]} 관계 필요`];
  if(n.bat!=null&&s.bat<n.bat) return [false,'배터리 없음'];
  if(n.dead&&s.bat>0) return [false,'스마트폰이 켜져 있음'];
  if(n.custom===false) return [false,n.label];
  return [true,n.st!=null?`ST ${n.st}`:n.item?n.item:n.any?n.any.join('/'):n.rel?`${n.rel[0]} 우호`:n.dead?'폰 꺼짐':n.custom?'약점 파악':''];
}
const cost=(s,c)=>{const t=R(c.time,s)||0;return t>0?Math.max(1,Math.ceil(t*(instinct(s)?0.85:1))):0;};

let HIST=[];
function pushHist(){ const snap=copy(S); HIST.push(snap); if(HIST.length>60) HIST.shift(); }
function canGoBack(){ return S.showHint||S.showInfo||S.li>0||HIST.length>0; }
function goBack(){
  finishTyping();
  if(S.showHint||S.showInfo){ S.showHint=false; S.showInfo=false; render(false); return; }
  const n=getLines(S).length;
  if(S.li>0 && S.scene!=='DEFEAT' && S.scene!=='END'){ S.li=Math.min(S.li,n)-1; render(false); return; }   // 한 줄 전 대사 (선택지 화면이면 마지막 대사)
  if(!HIST.length) return;                                                    // 첫 장면 첫 대사: 더 갈 곳 없음
  const prev=HIST.pop(), cp=S.cp, hints=S.hints;                              // 직전 단계(이전 장면의 선택지 화면)
  S=prev; S.hints=Object.assign({},prev.hints,hints); if(!S.cp&&cp) S.cp=cp;
  S.showHint=false; S.showInfo=false;
  S.li=getLines(S).length; S.focus=firstEnabled(S);
  render(true);
}
function choose(c){
  pushHist();
  const s=S;
  const before={t:s.t,hp:s.hp,st:s.st,bat:s.bat,items:[...s.items]};
  const title=R(c.t,s);
  s.t+=cost(s,c);
  if(c.hp) s.hp=clamp(s.hp+c.hp);
  if(c.st) s.st=clamp(s.st+c.st);
  if(c.bat) s.bat=clamp(s.bat+c.bat);
  if(c.trust) s.trust+=c.trust;
  (c.add||[]).forEach(i=>{if(!has(s,i))s.items.push(i)});
  (c.rm||[]).forEach(i=>{s.items=s.items.filter(x=>x!==i)});
  if(c.set) Object.assign(s.f,c.set);
  if(c.rel) Object.assign(s.rel,c.rel);
  let res=R(c.res,s), go=c.go;
  if(c.act){const o=c.act(s);res=o.res;go=o.go;}
  s.moves++;
  s.log.push([fmt(s.t),title]);
  s.res={title,text:res||'',delta:diff(before,s)};
  goTo(R(go,s));
}
function diff(a,s){
  const o=[];
  if(s.t-a.t) o.push(['neg',`+${s.t-a.t}분`]);
  if(s.hp!==a.hp) o.push([s.hp>a.hp?'pos':'neg',`HP ${s.hp>a.hp?'+':''}${s.hp-a.hp}`]);
  if(s.st!==a.st) o.push([s.st>a.st?'pos':'neg',`ST ${s.st>a.st?'+':''}${s.st-a.st}`]);
  if(s.bat!==a.bat) o.push([s.bat>a.bat?'pos':'neg',`배터리 ${s.bat>a.bat?'+':''}${s.bat-a.bat}%`]);
  s.items.filter(i=>!a.items.includes(i)).forEach(i=>o.push(['item',`획득: ${i}`]));
  a.items.filter(i=>!s.items.includes(i)).forEach(i=>o.push(['neg',`소모: ${i}`]));
  return o;
}
function goTo(id){
  const s=S; s.showHint=false; s.showInfo=false; s.li=0; s.focus=0;
  if(s.hp<=0){ s.defeatAt=s.scene==='BATTLE'?BATTLES[s.battle.id].img:(SC[s.scene]?.img||'s09'); s.battle=null; s.scene='DEFEAT'; return render(true); }
  if(id==='END'){ s.ending=s.t<=DEADLINE?'win':'sad'; s.scene='END'; return render(true); }
  const changed=id!==s.scene && id!=='BATTLE' && !(s.scene==='BATTLE'&&false);
  if(changed && id!=='sc01') s.bat=Math.max(0,s.bat-1);
  s.scene=id;
  const sc=SC[id];
  if(sc&&changed&&sc.enter) sc.enter(s);
  if(s.hp<=0){ s.defeatAt=sc?.img||'s09'; s.scene='DEFEAT'; return render(true); }
  if(sc&&sc.cp&&changed){ const snap=copy(s); delete snap.cp; s.cp=snap; }
  render(true);
}
function useItem(name){
  const s=S,u=ITEMS[name]?.use; if(!u) return;
  pushHist();
  const before={t:s.t,hp:s.hp,st:s.st,bat:s.bat,items:[...s.items]};
  if(u.hp) s.hp=clamp(s.hp+u.hp); if(u.st) s.st=clamp(s.st+u.st); if(u.bat) s.bat=clamp(s.bat+u.bat);
  s.items=s.items.filter(i=>i!==name); s.t+=2;
  s.log.push([fmt(s.t),`${name} 사용`]);
  s.li=0; s.showInfo=false;
  s.res={title:`${name} 사용`,text:name==='보조배터리'?'보조배터리를 꽂았다. 배터리 막대가 차오른다.':'우걱우걱. 힘이 난다.',delta:diff(before,s)};
  render(false);
}

/* ================= RENDER ================= */
const app=document.getElementById('app');
const WHO={'권주임':'me','엄마':'mom','강사':'teacher','외계인':'alien','외계 생명체':'alien','외계인 경비병':'alien','외계인 지도자':'alien','방어 시스템':'alien','군인':'army'};
function danger(t){
  if(t<480) return ['경계','서울 상공 UFO 다수 출현 · 시민 외출 자제 권고'];
  if(t<515) return ['심각','지하철 2호선 전력 장애 · 강남권 정전'];
  if(t<550) return ['교전','북한군 작전 개시 · 외계인 통신 교란 확대'];
  return ['세계대전','제3차 세계대전 발발 · 코엑스 외계 지휘 본부 확인'];
}
function hud(s){
  const left=DEADLINE-s.t, sc=curScene(s)||{};
  const st=s.hp<=25?'위독':s.hp<=60?'부상':'정상 상태';
  const bar=(l,v,c,x='')=>`<div class="bar"><span>${l}</span><div class="track"><div class="fill" style="width:${v}%;background:${c}"></div></div><span class="num">${v}${x}</span></div>`;
  return `<div class="hud"><div class="hud-in">
    <div class="clock"><span class="now">${fmt(s.t)}</span><span class="left">${left>=0?`출석까지 <b>${left}</b>분`:`<b style="color:var(--alarm)">${-left}분 지각</b>`}</span></div>
    <div class="bars">${bar('HP',s.hp,'var(--hp)')}${bar('ST',s.st,'var(--st)')}${bar('배터리',s.bat,'var(--bat)','%')}</div>
    <div class="chips">${sc.n?`<span class="chip">SCENE ${String(sc.n).padStart(2,'0')} / ${TOTAL}</span>`:''}<span class="chip ${s.hp<=60?'warn':''}">${st}</span><span class="chip warn">서울 ${danger(s.t)[0]}</span>${instinct(s)&&!s.ending?'<span class="chip hot">출근 본능 발동</span>':''}${SC[s.scene]||s.scene==='BATTLE'?'<button class="infobtn" data-info>정보 · 관계 · 기록</button>':''}</div>
  </div></div>`;
}
function lineHTML([w,t]){
  if(w==='') return `<p>${esc(t)}</p>`;
  if(w==='*') return `<p class="ln-sfx">${esc(t)}</p>`;
  if(w==='#') return `<p class="ln-sys">${esc(t)}</p>`;
  if(w==='!') return `<div class="alert"><div class="ah">⚠ 긴급재난문자</div><div class="ab">${esc(t)}</div></div>`;
  if(w==='뉴스 속보'||w==='안내 방송') return `<div class="ln-news"><b>${esc(w)}</b>${esc(t)}</div>`;
  return `<div class="ln-say"><span class="who ${WHO[w]||''}">${esc(w)}</span><p>${esc(t)}</p></div>`;
}
const RELC=v=>['우호','흐뭇','걱정'].includes(v)?'r-good':['적대','서운','냉정'].includes(v)?'r-bad':'r-mid';

function drawer(s){
  const canUse=!!SC[s.scene];
  const inv=s.items.map(i=>`<li><div>${esc(i)}<small>${esc(ITEMS[i]?.d||'')}</small></div>${ITEMS[i]?.use&&canUse?`<button class="use" data-use="${esc(i)}">사용 · 2분</button>`:''}</li>`).join('');
  const rel=Object.entries(s.rel).map(([k,v])=>`<span>${esc(k)}</span><span class="${RELC(v)}">${esc(v)}</span>`).join('');
  const lg=s.log.length?s.log.slice().reverse().map(([t,x])=>`<li><span>${t}</span>${esc(x)}</li>`).join(''):'<li class="empty">첫 선택을 기다리는 중</li>';
  return `<button class="backdrop" data-info aria-label="닫기"></button><aside class="drawer" aria-label="소지품 기록">
    <div class="dh"><b>소지품 기록</b><button class="infobtn" data-info>닫기</button></div>
    <div class="box"><h4>소지품</h4><ul class="inv">${inv}</ul></div>
    <div class="box"><h4>NPC 관계 · 군인 신뢰 ${trustScore(s)}</h4><div class="rel">${rel}</div></div>
    <div class="box prof"><h4>프로필</h4><span class="nm">권주임 · 28세 취준생</span>
      <span class="ab">특수 능력 <b>출근 본능</b> · 남은 시간 40분 이하에서 이동 15% 단축, 공격력 ×1.5</span>
      <span class="ab">필살기 <b>"내가 오늘 수업 빠지면 네가 책임질 거야?!"</b> · ST 30</span></div>
    <div class="box"><h4>행동 기록</h4><ul class="log">${lg}</ul></div>
    <button class="restart" data-restart>처음부터 다시 하기</button>
  </aside>`;
}
function choiceList(s){ return s.scene==='BATTLE'?battleChoices(s):R(SC[s.scene].choices,s).filter(c=>!(c.hide&&c.hide(s))); }
function battleHint(s){
  const b=s.battle,d=BATTLES[b.id];
  if(d.boss) return '보스는 체력에 따라 패턴이 바뀐다. 3페이즈의 "레이저 충전"을 보면 다음 턴에 방어하자. 레이저를 막으면 피해가 0이고 약점이 드러난다. 필살기는 40의 피해와 함께 반격을 막는다. 위험하면 아이템을 써서 버티자.';
  return `"다음 공격"을 보고 행동을 고르자. 약점(${d.weakName})을 알면 약점 공격이 가장 효율적이다. 스태미나 30 이상이면 필살기로 한 번에 끝낼 수 있다.`;
}

/* ---------- visual-novel screen ---------- */
function getLines(s){
  const out=[];
  if(s.res&&(s.res.text||s.res.delta.length)) out.push({kind:'result',who:s.res.title,text:s.res.text,delta:s.res.delta});
  if(s.scene==='BATTLE'){ const b=s.battle,d=BATTLES[b.id]; if(b.turn===0) d.intro.forEach(x=>{const [w,t]=Array.isArray(x)?x:['',x];out.push({who:w,text:t});}); }
  else R(SC[s.scene].lines,s).forEach(([w,t])=>out.push({who:w,text:t}));
  return out;
}
const enabled=(s,c)=>{const [ok]=needOK(s,c);return ok&&!(c.bat<0&&s.bat<=0);};
function firstEnabled(s){const l=choiceList(s);const i=l.findIndex(c=>enabled(s,c));return i<0?0:i;}
const PLATE={me:'p-me',mom:'p-mom',teacher:'p-teacher',alien:'p-alien',army:'p-army'};
function chips(arr){return arr.map(([k,v])=>`<span class="d ${k}">${esc(v)}</span>`).join('');}
function choiceMeta(s,c){
  const m=[`<span class="tm">${cost(s,c)}분</span>`];
  if(c.hp) m.push(`<span>HP ${c.hp>0?'+':''}${c.hp}</span>`);
  if(c.st) m.push(`<span>ST ${c.st>0?'+':''}${c.st}</span>`);
  if(c.bat) m.push(`<span>배터리 ${c.bat}%</span>`);
  const [ok,why]=needOK(s,c); if(c.need) m.push(`<span class="${ok?'req':'ng'}">${esc(why)}</span>`);
  const nt=c.note&&R(c.note,s); if(nt) m.push(`<span class="${nt[0]}">${esc(nt[1])}</span>`);
  if(c.bat<0&&s.bat<=0) m.push('<span class="ng">배터리 없음</span>');
  return m.join('');
}
let typing=null;
function vnHTML(s){

function render(top){
  const s=S, game=!!(SC[s.scene]||s.scene==='BATTLE');
  document.body.classList.toggle('game',game);
  document.body.classList.toggle('cv',s.scene==='title');
  if(typing){clearInterval(typing);typing=null;}
  if(s.scene==='title') app.innerHTML=titleHTML();
  else if(s.scene==='END') app.innerHTML=`${hud(s)}<div class="wrap">${endingHTML(s)}</div>`;
  else if(s.scene==='DEFEAT') app.innerHTML=`${hud(s)}<div class="wrap">${defeatHTML(s)}</div>`;
  else { app.innerHTML=vnHTML(s); startTyping(); }
  if(top) window.scrollTo(0,0);
}
function startTyping(){
  const el=document.getElementById('dlgText'); if(!el||!el.dataset.full) return;
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const full=el.dataset.full; let i=0; el.textContent='';
  el.closest('.dlg')?.classList.add('typing');
  typing=setInterval(()=>{ i+=2; el.textContent=full.slice(0,i); if(i>=full.length) finishTyping(); },24);
}
function finishTyping(){
  if(!typing) return false; clearInterval(typing); typing=null;
  const el=document.getElementById('dlgText'); if(el&&el.dataset.full) el.textContent=el.dataset.full;
  el?.closest('.dlg')?.classList.remove('typing'); return true;
}
function advance(){
  if(finishTyping()) return;
  const n=getLines(S).length;
  S.li=Math.min(n,S.li+1); if(S.li>=n) S.focus=firstEnabled(S);
  render(false);
}
function moveFocus(d){
  const l=choiceList(S); if(!l.length) return; let i=S.focus??0;
  for(let k=0;k<l.length;k++){ i=(i+d+l.length)%l.length; if(enabled(S,l[i])) break; }
  S.focus=i; render(false);
}
app.addEventListener('click',e=>{
  const b=e.target.closest('button,[data-adv]'); if(!b||b.disabled) return;
  if(b.hasAttribute('data-start')){S=fresh();HIST=[];goTo('sc01');return;}
  if(b.hasAttribute('data-help')){S.showHelp=!S.showHelp;render(false);return;}
  if(b.hasAttribute('data-back')){goBack();return;}
  if(b.hasAttribute('data-restart')){S=fresh();HIST=[];render(true);return;}
  if(b.hasAttribute('data-retry')){const cp=S.cp,r=S.retries+1,h=S.hints;S=copy(cp);S.cp=cp;S.retries=r;S.hints=h;const hb=S.hp,sb=S.st;S.hp=Math.max(S.hp,70);S.st=Math.max(S.st,50);S.li=0;S.res={title:'체크포인트에서 재도전',text:'숨을 고르고 다시 시작한다. 체크포인트 보정으로 체력 70, 스태미나 50까지 회복했다. 시간은 그대로다.',delta:[...(S.hp>hb?[['pos',`HP +${S.hp-hb}`]]:[]),...(S.st>sb?[['pos',`ST +${S.st-sb}`]]:[])]};render(true);return;}
  if(b.hasAttribute('data-info')){S.showInfo=!S.showInfo;render(false);return;}
  if(b.hasAttribute('data-hint')){S.showHint=!S.showHint;if(S.showHint)S.hints[S.scene]=1;render(false);return;}
  if(b.hasAttribute('data-skip')){e.stopPropagation();S.li=getLines(S).length;S.focus=firstEnabled(S);render(false);return;}
  if(b.hasAttribute('data-replay')){S.li=0;render(false);return;}
  if(b.dataset.mv){moveFocus(+b.dataset.mv);return;}
  if(b.dataset.use){useItem(b.dataset.use);return;}
  if(b.dataset.i!=null){const c=choiceList(S)[+b.dataset.i]; if(c) choose(c); return;}
  if(b.hasAttribute('data-adv')){advance();return;}
});
app.addEventListener('mouseover',e=>{
  const b=e.target.closest('.mbar'); if(!b||b.disabled) return;
  const i=+b.dataset.i; if(S.focus!==i){S.focus=i;const box=document.querySelector('.dlg'); if(box){ // update box only
    const c=choiceList(S)[i]; box.querySelector('.plate').textContent=`선택 ${String(i+1).padStart(2,'0')}`;
    box.querySelector('.dlg-body').innerHTML=`<p class="dlg-text">${esc(c.d||'')}</p><div class="dlg-meta">${choiceMeta(S,c)}</div>`;
    document.querySelectorAll('.mbar').forEach(x=>x.classList.toggle('focus',+x.dataset.i===i)); }}
});
document.addEventListener('keydown',e=>{
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  if(S.scene==='title'){ if(e.key==='Escape'&&S.showHelp){S.showHelp=false;render(false);} else if(!S.showHelp&&(e.key==='Enter'||e.key===' ')){e.preventDefault();S=fresh();HIST=[];goTo('sc01');} return; }
  if((S.scene==='DEFEAT'||S.scene==='END')&&e.key==='Backspace'){e.preventDefault();goBack();return;}
  if(!(SC[S.scene]||S.scene==='BATTLE')) return;
  if(e.key==='Backspace'){e.preventDefault();goBack();return;}
  if(e.key==='Escape'){ if(S.showInfo||S.showHint){S.showInfo=false;S.showHint=false;render(false);} return; }
  if(S.showInfo) return;
  if(e.key==='h'||e.key==='H'){S.showHint=!S.showHint;if(S.showHint)S.hints[S.scene]=1;render(false);return;}
  if(e.key==='i'||e.key==='I'){S.showInfo=true;render(false);return;}
  const choosing=S.li>=getLines(S).length&&!S.showHint;
  if(!choosing){ if(e.key===' '||e.key==='Enter'){e.preventDefault();advance();} return; }
  if(e.key==='ArrowDown'){e.preventDefault();moveFocus(1);return;}
  if(e.key==='ArrowUp'){e.preventDefault();moveFocus(-1);return;}
  if(e.key==='Enter'||e.key===' '){e.preventDefault();const c=choiceList(S)[S.focus];if(c&&enabled(S,c))choose(c);return;}
  if(/^[1-9]$/.test(e.key)){const c=choiceList(S)[+e.key-1];if(c&&enabled(S,c))choose(c);}
});
function showError(msg){
  app.innerHTML=`<div class="wrap" style="padding-block:40px"><div class="hint"><b>오류</b>게임을 불러오지 못했습니다: ${esc(msg)}</div><button class="go" style="margin-top:16px" data-start>처음부터 시작</button></div>`;
}
window.addEventListener('error',e=>{ try{ S=fresh(); showError(e.message||'알 수 없는 오류'); }catch(_){} });
function start(saved){
  try{
    if(saved&&typeof saved==='object'&&saved.scene&&(SC[saved.scene]||saved.scene==='title'||(saved.scene==='BATTLE'&&saved.battle))){ S=Object.assign(fresh(),saved); }
    else S=fresh();
    render(false);
  }catch(err){ S=fresh(); try{render(false);}catch(e2){showError(e2.message);} }
}
try{ window.claude?.hot?.snapshot?.(()=>copy(S)); }catch(e){}
try{ if(window.claude?.hot?.ready) window.claude.hot.ready(d=>start(d)); else start(null); }catch(e){ start(null); }
window.__game={SC,BATTLES,get S(){return S},choose,choiceList,goTo,fresh,needOK,set(s){S=s}};
})();
</script>
